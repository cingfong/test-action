name: PR測試流程

on:
  pull_request:
    branches:
      - main
      - 'w*'

env:
  FRONTEND_CONFIG_ENV_NAME: staging # 前端發佈設定檔名稱

jobs:
  check:
    name: 程式碼檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5

      # 將 pnpm store 固定在 workspace 之外。act 容器 HOME 不一致時，store 會落入
      # 工作目錄，導致 `eslint .` 掃到 store 的 minified JSON 索引檔而誤報；真 GitHub
      # runner 本來就在 workspace 外，設定此步無副作用。須在 setup-node 前執行，
      # 才能讓其 `cache: pnpm` 取到正確的 store 路徑。
      - name: 設定 pnpm store 位置
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 設定環境設定檔
        run: |
          if [ -f .env.${{ env.FRONTEND_CONFIG_ENV_NAME }} ]; then
            mv .env.${{ env.FRONTEND_CONFIG_ENV_NAME }} .env
          fi

      - name: 安裝依賴項
        run: pnpm install --frozen-lockfile

      - name: 執行程式碼檢查
        run: pnpm lint

      - name: 執行類型檢查
        run: pnpm typecheck

  test:
    name: 單元測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5

      - name: 設定 pnpm store 位置
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 設定環境設定檔
        run: |
          if [ -f .env.${{ env.FRONTEND_CONFIG_ENV_NAME }} ]; then
            mv .env.${{ env.FRONTEND_CONFIG_ENV_NAME }} .env
          fi

      - name: 安裝依賴項
        run: pnpm install --frozen-lockfile

      - name: 執行單元測試
        run: pnpm test
